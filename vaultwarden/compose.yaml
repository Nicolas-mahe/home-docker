services:
  vaultwarden:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/vaultwarden/server:${VAULTWARDEN_TAG:-latest-alpine}
    container_name: vaultwarden
    hostname: vaultwarden
    labels:
      traefik.enable: true
      traefik.http.routers.vaultwarden.tls: true
      traefik.http.routers.vaultwarden.tls.certresolver: cloudflare
      traefik.http.routers.vaultwarden.middlewares: authelia@docker,sablier-vaultwarden@docker
      traefik.http.routers.vaultwarden.entrypoints: websecure
      traefik.http.routers.vaultwarden.rule: Host(`vaultwarden.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.vaultwarden.service: vaultwarden
      traefik.http.services.vaultwarden.loadBalancer.server.port: 80
      #sablier
      sablier.enable: true
      sablier.group: vaultwarden
      sablier.running-hours: "04:50-06:30"
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-vaultwarden.plugin.sablier.group: vaultwarden
      traefik.http.middlewares.sablier-vaultwarden.plugin.sablier.dynamic.displayName: vaultwarden
    environment:
      DOMAIN: https://vaultwarden.${PERSONAL_DOMAIN_NAME}
      TZ: Europe/Paris
      # ADMIN_TOKEN: ${ADMIN_TOKEN} # only on creation
    volumes:
      - vaultwarden:/data/
    expose:
      - 80
    networks:
      - webinternal
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  vaultwarden:
    name: vaultwarden

networks:
  webinternal:
    name: webinternal