services:
  minio:
    restart: ${RESTART:-unless-stopped}
    image: quay.io/minio/aistor/minio:${MINIO_TAG:-latest}
    container_name: minio
    hostname: minio
    labels:
      traefik.enable: true
      traefik.http.routers.minio-web.tls: true
      traefik.http.routers.minio-storage.tls: true
      traefik.http.routers.minio-storage.tls.certresolver: cloudflare
      traefik.http.routers.minio-storage.tls.domains[0].main: s3.${PERSONAL_DOMAIN_NAME}
      traefik.http.routers.minio-storage.tls.domains[0].sans: "*.s3.${PERSONAL_DOMAIN_NAME}"
      traefik.http.routers.minio-storage.entrypoints: websecure
      traefik.http.routers.minio-storage.rule: Host(`s3.${PERSONAL_DOMAIN_NAME}`) || HostRegexp(`^.+\.(s3.${PERSONAL_DOMAIN_NAME})$`)
      traefik.http.routers.minio-storage.service: minio-storage
      traefik.http.services.minio-storage.loadbalancer.server.port: 9000
      traefik.http.routers.minio-web.tls.certresolver: cloudflare
      traefik.http.routers.minio-web.entrypoints: websecure
      traefik.http.routers.minio-web.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.minio-web.rule: Host(`minio.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.minio-web.service: minio-web
      traefik.http.services.minio-web.loadbalancer.server.port: 9001
    expose:
      - 9000 # API S3
      - 9001 # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?root user is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?root password is required}
      MINIO_SERVER_URL: https://s3.${PERSONAL_DOMAIN_NAME}
      MINIO_SITE_REGION: eu-east-0
      MINIO_BROWSER_REDIRECT: true
      MINIO_BROWSER_REDIRECT_URL: https://minio.${PERSONAL_DOMAIN_NAME}
      # # HDD optimizations
      # MINIO_API_REQUESTS_MAX: 64
      MINIO_DRIVE_MAX_TIMEOUT: 60s
      MINIO_DRIVE_PREALLOCATE: on
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/minio/license:/minio.license:ro
      - /${RAID_DATA_DIRECTORY:?raid path is required}/backup/s3:/data
    command: server /data --console-address ":9001"
    networks:
      - webinternal

networks:
  webinternal:
    name: webinternal