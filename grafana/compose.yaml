services:
  grafana:
    restart: unless-stopped
    image: docker.io/grafana/grafana-oss:${GRAFANA_TAG:-latest}
    container_name: grafana
    hostname: grafana
    user: "${PERSONAL_MONITORING_UID:-0}:${PERSONAL_MONITORING_GID:-0}"
    labels:
      traefik.enable: true
      traefik.http.routers.grafana.tls: true
      traefik.http.routers.grafana.tls.certresolver: cloudflare
      traefik.http.routers.grafana.middlewares: authelia@docker,sablier-grafana@docker,web-utils@docker
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.rule: Host(`monitoring.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.grafana.service: grafana
      traefik.http.services.grafana.loadBalancer.server.port: 3000
      #sablier
      sablier.enable: true
      sablier.group: grafana
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-grafana.plugin.sablier.group: grafana
      traefik.http.middlewares.sablier-grafana.plugin.sablier.dynamic.displayName: Grafana
    environment:
      TZ: Europe/Paris
      GF_SERVER_ROOT_URL: 'https://monitoring.${PERSONAL_DOMAIN_NAME}'
      GF_AUTH_BASIC_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: 'Authelia - ${PERSONAL_DOMAIN_NAME}'
      GF_AUTH_GENERIC_OAUTH_ICON: signin
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: '${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}'
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}'
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: false
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: true
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: 'https://auth.${PERSONAL_DOMAIN_NAME}/api/oidc/authorization'
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: 'https://auth.${PERSONAL_DOMAIN_NAME}/api/oidc/token'
      GF_AUTH_GENERIC_OAUTH_API_URL: 'https://auth.${PERSONAL_DOMAIN_NAME}/api/oidc/userinfo'
      GF_AUTH_SIGNOUT_REDIRECT_URL: 'https://auth.${PERSONAL_DOMAIN_NAME}/logout'
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: true
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admin') && 'GrafanaAdmin' || contains(groups[*], 'Maison') && 'Admin' || contains(groups[*], 'Gamers') && 'Editor' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InHeader
      # Optionally enable auto-login (bypasses Grafana login screen)
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: true
      GF_AUTH_GOOGLE_AUTO_LOGIN: false
      GF_AUTH_GITHUB_AUTO_LOGIN: false
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/grafana/data:/var/lib/grafana
    expose:
      - 3000
    networks:
      - webinternal
      - monitoring
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  prometheus:
    restart: unless-stopped
    image: docker.io/prom/prometheus:${PROMETHEUS_TAG:-latest}
    container_name: prometheus
    hostname: prometheus
    user: "${PERSONAL_MONITORING_UID:-0}:${PERSONAL_MONITORING_GID:-0}"
    labels:
      traefik.enable: true
      traefik.http.routers.prometheusdb.tls: true
      traefik.http.routers.prometheusdb.tls.certresolver: cloudflare
      traefik.http.routers.prometheusdb.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.prometheusdb.entrypoints: websecure
      traefik.http.routers.prometheusdb.rule: Host(`prometheus.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.prometheusdb.service: prometheusdb
      traefik.http.services.prometheusdb.loadBalancer.server.port: 9090
    environment:
      TZ: Europe/Paris
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/grafana/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    command: 
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PERSONAL_METRICS_RETENTION_TIME}"
    networks:
      - webinternal
      - monitoring
    depends_on:
      cadvisor:
        condition: service_healthy
      node_exporter:
        condition: service_started
    # healthcheck:
    #   test: ["CMD", "wget", "http://127.0.0.1:9090"]
    #   interval: 10s
    #   timeout: 15s
    #   retries: 10
    #   start_period: 40s 

  cadvisor:
    restart: unless-stopped
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_TAG:-latest} # google registry
    container_name: cadvisor
    hostname: cadvisor
    pid: host
    privileged: true
    environment:
      TZ: Europe/Paris
    volumes:
      - /:/rootfs:ro
      - /run:/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - ${CADVISOR_PORT:-8081}:8080
    networks:
      - monitoring
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=disk,process,referenced_memory,cpuLoad,percpu,hugetlb,memory_numa,oom_event,perf_event,resctrl,sched,tcp,udp,advtcp,app,cpuset
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  node_exporter:
    restart: unless-stopped
    image: quay.io/prometheus/node-exporter:${NODE_EXPORTER_TAG:-latest}
    container_name: node_exporter
    hostname: node_exporter
    pid: host
    environment:
      TZ: Europe/Paris
    volumes:
      - /:/host:ro,rslave
    command: --path.rootfs=/host
    ports:
      - ${NODE_EXPORTER_PORT:-9100}:9100
    networks:
      - monitoring

