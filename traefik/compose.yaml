services:
  ################# DNS setting #################
  # # Without Public IP
  # cloudflared:
  #   restart: ${RESTART:-unless-stopped}
  #   image: docker.io/cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
  #   container_name: cloudflared
  #   hostname: cloudflared
  #   labels:
  #     diun.enable: true
  #     diun.watch_repos: true
  #   environment:
  #     - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
  #     - TUNNEL_METRICS=0.0.0.0:60123
  #   networks:
  #     - webexpose
  #   command: tunnel --no-autoupdate run
  #   healthcheck:
  #     test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:60123", "ready"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Throw Public IP
  cloudflare-ddns:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/oznu/cloudflare-ddns
    container_name: cloudflare-ddns
    hostname: cloudflare-ddns
    environment:
      API_KEY: ${DNS_API_KEY}
      ZONE: ${PERSONAL_DOMAIN_NAME}
      PROXIED: true
      TZ: Europe/Paris
      DELETE_ON_STOP: false
    networks:
      - webexpose

  ################# Traefik #################
  whoami:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/traefik/whoami:${WHOAMI_TAG:-latest}
    container_name: whoami
    hostname: whoami
    labels:
      traefik.enable: true
      traefik.http.routers.whoami.tls: true
      traefik.http.routers.whoami.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.whoami.entrypoints: websecure
      traefik.http.routers.whoami.rule: Host(`whoami.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.whoami.service: whoami
      traefik.http.services.whoami.loadBalancer.server.port: 80
    environment:
      TZ: Europe/Paris
    expose:
      - 80
    networks:
      - webinternal

  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    hostname: traefik-manager
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.traefik-manager.tls: true
      traefik.http.routers.traefik-manager.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.traefik-manager.rule: Host(`traefik-manager.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.traefik-manager.entrypoints: websecure
      traefik.http.routers.traefik-manager.service: traefik-manager
      traefik.http.services.traefik-manager.loadbalancer.server.port: 5000
    environment:
      COOKIE_SECURE: true
    volumes:
      # - /opt/docker-compose/traefik/config.yml:/app/config/dynamic.yml
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/conf:/app/config
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/backups:/app/backups
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/certs/acme.json:/app/acme.json:ro
    networks:
      - webinternal

  traefik:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/library/traefik:${TRAEFIK_TAG:-v3.6.2}
    container_name: traefik
    hostname: traefik
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: true
      traefik.http.routers.dashboard.tls: true
      traefik.http.routers.dashboard.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.rule: Host(`traefik.${PERSONAL_DOMAIN_NAME}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      traefik.http.routers.dashboard.service: api@internal
    environment:
      TZ: Europe/Paris
      CF_DNS_API_TOKEN: ${PERSONAL_CF_TRAEFIK_API}
      CF_API_EMAIL: ${PERSONAL_CF_MAIL}
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/conf/:/etc/traefik/conf/
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/certs/:/etc/traefik/certs/
    ports:
      - 443:443/tcp
      - 6322:6322/tcp
      - 25565:25565/tcp
      - 7777:7777/tcp
      - 7777:7777/udp
      - 8888:8888/tcp
    expose:
      - 6322  # Gitlab SSH
      - 443   # HTTPS
      - 8080  # dashboard
      - 8082  # ping
      - 25565 # Minecraft
      - 7777  # Satisfactory
    depends_on:
      authelia:
        condition: service_healthy
      crowdsec:
        condition: service_healthy
      cloudflare-ddns:
        condition: service_started
      # cloudflared:
      #   condition: service_healthy
    networks:
      crowdsec:
        ipv4_address: 172.50.0.254
      docker-proxy-ro:
      monitoring:
      webexpose:
      webinternal:
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - --global.sendAnonymousUsage
      - --global.checkNewVersion=false
      - --log.level=INFO
      - --log.nocolor=false
      - --accesslog=true
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --ping.entryPoint=ping
      - --metrics.addinternals
      - --metrics.prometheus=true

      # Certificates management
      - --certificatesresolvers.cloudflare.acme.dnsChallenge=true
      - --certificatesresolvers.cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.cloudflare.acme.email=${PERSONAL_CF_MAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/certs/acme.json
      - --entrypoints.websecure.http.tls.domains[0].main=${PERSONAL_DOMAIN_NAME}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${PERSONAL_DOMAIN_NAME}
      - --entrypoints.websecure.http.tls.domains[1].main=s3.${PERSONAL_DOMAIN_NAME}
      - --entrypoints.websecure.http.tls.domains[1].sans=*.s3.${PERSONAL_DOMAIN_NAME}

      # Entrypoint management
      - --entrypoints.ping.address=:8082
      - --entrypoints.websecure.address=:443
      # - --entrypoints.websecure.http.encodedCharacters.allowEncodedSlash=true
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=600s
      - --entryPoints.websecure.forwardedHeaders.insecure=false
      # # Please see the Forwarded Header Trust section of the Authelia Traefik Integration documentation.
      # - --entryPoints.websecure.proxyProtocol.insecure=false # need trusted IPs provided
      # - --entryPoints.websecure.forwardedHeaders.trustedIPs=172.18.0.0/16,172.50.0.0/24
      # - --entryPoints.websecure.proxyProtocol.trustedIPs=172.18.0.0/16,172.50.0.0/24
      - --entrypoints.websecure.http.middlewares=crowdsec@docker
      - --entrypoints.websecure.http.tls.certResolver=cloudflare
      - --serversTransport.insecureSkipVerify=true  # need to put a validate cert everywhere for delete it
      - --entrypoints.gitlab-ssh.address=:6322
      - --entrypoints.minecraft.address=:25565
      - --entryPoints.satisfactory-tcp.address=:7777/tcp
      - --entryPoints.satisfactory-tcp.http.redirections.entryPoint.to=satisfactory-tcp
      - --entryPoints.satisfactory-tcp.http.redirections.entryPoint.scheme=https
      - --entryPoints.satisfactory-udp.address=:7777/udp
      - --entryPoints.satisfactory-tcp-reliable.address=:8888/tcp

      # Provider definition
      - --providers.docker.endpoint=tcp://docker-proxy-ro:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=webinternal
      - --providers.file.filename=/etc/traefik/conf/dynamic.yml
      - --providers.file.watch=true

      # Crowdsec definition
      - --experimental.plugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.bouncer.version=${CROWDSEC_PLUGIN_VERSION:?bouncer version required}

  web-utils:
    restart: unless-stopped
    image: registry.${PERSONAL_DOMAIN_NAME}/${UTILS_PROJECT_PATH}:${UTILS_DOCKER_TAG:-main}
    container_name: web-utils
    hostname: web-utils
    labels:
      traefik.enable: true
      traefik.http.routers.web-utils.tls: true
      traefik.http.routers.web-utils.entrypoints: websecure
      traefik.http.routers.web-utils.middlewares: web-utils@docker
      traefik.http.routers.web-utils.rule: Host(`utils.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.web-utils.service: web-utils
      traefik.http.middlewares.web-utils.errors.status: 400-404
      traefik.http.middlewares.web-utils.errors.service: web-utils
      traefik.http.middlewares.web-utils.errors.query: /error?e={status}&u={url}
      traefik.http.services.web-utils.loadBalancer.server.port: 5000
    environment:
      TZ: Europe/Paris
      SESSION_TOKEN: ${UTILS_SESSION_TOKEN}
      DEBUG_MODE: ${DEBUG_MODE:-False}
      ROOT_DOMAIN: https://utils.${PERSONAL_DOMAIN_NAME}
    expose:
      - 5000
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/web-utils:/app/static/external
    networks:
      - webinternal

  ################# Crowdsec #################
  redis-bouncer:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/library/redis:${REDIS_TAG:-alpine}
    container_name: redis-bouncer
    hostname: redis-bouncer
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 15s
      interval: 30s
      retries: 5
      timeout: 3s
    environment:
      TZ: Europe/Paris
    volumes:
      - crowdsec-redis:/data
    networks:
      crowdsec:
    command: --save 60 1 --loglevel warning

  crowdsec:
    restart: ${RESTART:-unless-stopped}
    image: ghcr.io/crowdsecurity/crowdsec:${CROWDSEC_TAG:-v1.7.3}
    container_name: crowdsec
    hostname: crowdsec
    security_opt:
      - no-new-privileges=true
    labels:
      traefik.enable: true
      traefik.docker.network: crowdsec
      traefik.http.middlewares.crowdsec.plugin.bouncer.enabled: true
      traefik.http.middlewares.crowdsec.plugin.bouncer.logLevel: INFO
      traefik.http.middlewares.crowdsec.plugin.bouncer.defaultDecisionSeconds: 86400
      traefik.http.middlewares.crowdsec.plugin.bouncer.httpTimeoutSeconds: 10
      traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecMode: live
      traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecLapiKey: ${CROWDSEC_API_TRAEFIK?:crowdsec api required}
      traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecLapiHost: crowdsec:8080
      traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecLapiScheme: http
      traefik.http.middlewares.crowdsec.plugin.bouncer.clientTrustedIPs: ${PERSONAL_IP_RANGES}
      traefik.http.middlewares.crowdsec.plugin.bouncer.forwardedHeadersTrustedIPs: ${CF_PROXY_IP}
      traefik.http.middlewares.crowdsec.plugin.bouncer.forwardedHeadersCustomName: X-Forwarded-For
      traefik.http.middlewares.crowdsec.plugin.bouncer.captchaProvider: recaptcha
      traefik.http.middlewares.crowdsec.plugin.bouncer.captchaSiteKey: ${CROWDSEC_CAPTCHA_SITE_KEY?:captcha key required}
      traefik.http.middlewares.crowdsec.plugin.bouncer.captchaSecretKey: ${CROWDSEC_CAPTCHA_SECRET_KEY?:captcha secret required}
      traefik.http.middlewares.crowdsec.plugin.bouncer.captchaGracePeriodSeconds: 1800
      traefik.http.middlewares.crowdsec.plugin.bouncer.captchaHTMLFilePath: /etc/traefik/conf/captcha.html
      traefik.http.middlewares.crowdsec.plugin.bouncer.banHTMLFilePath: /etc/traefik/conf/ban.html
      traefik.http.middlewares.crowdsec.plugin.bouncer.RedisCacheHost: redis-bouncer:6379
      traefik.http.middlewares.crowdsec.plugin.bouncer.RedisCacheEnabled: true
    environment:
      TZ: Europe/Paris
      CUSTOM_HOSTNAME: crowdsec
      BOUNCER_KEY_TRAEFIK: ${CROWDSEC_API_TRAEFIK:?crowdsec api required}
      COLLECTIONS: |
        crowdsecurity/appsec-generic-rules
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/home-assistant
        crowdsecurity/linux
        crowdsecurity/linux-lpe
        crowdsecurity/nextcloud
        crowdsecurity/whitelist-good-actors
        LePresidente/authelia
        LePresidente/grafana
        crowdsecurity/traefik
        Dominic-Wagner/vaultwarden
        gauth-fr/immich
        timokoessler/gitlab
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/crowdsec/config:/etc/crowdsec #Config Crowdsec
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/crowdsec/html:/etc/traefik/conf #Additional Config Crowdsec
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/crowdsec/data:/var/lib/crowdsec/data/ #Config Crowdsec
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/nextcloud/config/log/:/var/log/nextcloud/:ro #Logs nginx + php Nextcloud
    expose:
      - 6060 #monitoring
      - 8080
    networks:
      crowdsec:
      docker-proxy-ro:
      monitoring:
      webexpose:
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis-bouncer:
        condition: service_healthy

  ################# Authelia #################
  authelia:
    restart: ${RESTART:-unless-stopped}
    image: ghcr.io/authelia/authelia:${AUTHELIA_TAG:-4.39.14}
    container_name: authelia
    hostname: authelia
    labels:
      traefik.enable: true
      traefik.http.routers.authelia.tls: true
      traefik.http.routers.authelia.entrypoints: websecure
      traefik.http.routers.authelia.rule: Host(`auth.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.authelia.service: authelia
      traefik.http.services.authelia.loadBalancer.server.port: 9091
      traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      ## configured in the Session Cookies section of the Authelia configuration.
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: true
      traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'
    environment:
      TZ: Europe/Paris
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/HMAC_SECRET_FILE
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/STORAGE_ENCRYPTION_KEY
    expose:
      - 9091
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/traefik/authelia:/config
    networks:
      - webinternal
      - authelia
    secrets: ['HMAC_SECRET_FILE', 'JWT_SECRET', 'SESSION_SECRET', 'STORAGE_ENCRYPTION_KEY']
    command:
      - 'authelia'
      - '--config=/config/configuration.yml'
      - '--config=/config/configuration.acl.yml'
      - '--config=/config/configuration.identity_providers.yml'
    depends_on:
      redis-authelia:
        condition: service_healthy

  redis-authelia:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/library/redis:${REDIS_TAG:-alpine}
    container_name: redis-authelia
    hostname: redis-authelia
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 15s
      interval: 30s
      retries: 5
      timeout: 3s
    environment:
      TZ: Europe/Paris
    expose:
      - 6379
    volumes:
      - authelia-redis:/data
    networks:
      - authelia
    command: --save 60 1 --loglevel warning

secrets:
  HMAC_SECRET_FILE:
    file: /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-secret/web/HMAC_SECRET_FILE
  JWT_SECRET:
    file: /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-secret/web/JWT_SECRET
  SESSION_SECRET:
    file: /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-secret/web/SESSION_SECRET
  STORAGE_ENCRYPTION_KEY:
    file: /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-secret/web/STORAGE_ENCRYPTION_KEY

volumes:
  authelia-redis:
    name: authelia-redis
  crowdsec-redis:
    name: crowdsec-redis

networks:
  authelia:
    name: authelia
  crowdsec:
    name: crowdsec
    ipam:
      config:
        - subnet: "172.50.0.0/24"
  docker-proxy-ro:
    name: docker-proxy-ro
  monitoring:
    name: monitoring
  webexpose:
    name: webexpose
  webinternal:
    name: webinternal