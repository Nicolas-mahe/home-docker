# https://technotim.com/posts/paperless-ngx-local-ai/
# https://github.com/timothystewart6/paperless-stack
services:
  paperless:
    restart: ${RESTART:-unless-stopped}
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-server
    hostname: paperless-server
    labels:
      traefik.enable: true
      traefik.http.routers.paperless.tls: true
      traefik.http.routers.paperless.tls.certresolver: cloudflare
      traefik.http.routers.paperless.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.paperless.entrypoints: websecure
      traefik.http.routers.paperless.rule: Host(`paperless.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.paperless.service: paperless
      traefik.http.services.paperless.loadbalancer.server.port: 8000
    environment:
      TZ: Europe/Paris
      USERMAP_UID: ${PAPERLESS_UID:?user id is required}
      USERMAP_GID: ${PAPERLESS_GID:?group id is required}
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?secret key is required}
      PAPERLESS_TIME_ZONE: Europe/Paris
      PAPERLESS_OCR_LANGUAGE: fra
      PAPERLESS_URL: https://paperless.${PERSONAL_DOMAIN_NAME}
      PAPERLESS_AUTO_LOGIN_USERNAME: ${PAPERLESS_USER}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_USER:?admin user is required}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?admin password is required}
      PAPERLESS_USE_X_FORWARD_HOST: true
      PAPERLESS_USE_X_FORWARD_PORT: true
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      # PAPERLESS_FILENAME_FORMAT: # https://docs.paperless-ngx.com/advanced_usage/#file-name-handling
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/paperless/data:/usr/src/paperless/data
      - /${RAID_DATA_DIRECTORY:?raid path is required}/paperless/media:/usr/src/paperless/media
      - /${RAID_DATA_DIRECTORY:?raid path is required}/paperless/export:/usr/src/paperless/export
      - /${RAID_DATA_DIRECTORY:?raid path is required}/paperless/consume:/usr/src/paperless/consume
    ports:
      - 8000:8000
    networks:
      - paperless
      - webinternal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      tika:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "-L", "--max-time", "2", "http://localhost:8000" ]
      start_period: 300s
      interval: 30s
      retries: 5
      timeout: 10s

  postgres:
    image: postgres:18
    restart: ${RESTART:-unless-stopped}
    container_name: paperless-postgres
    hostname: paperless-postgres
    environment:
      TZ: Europe/Paris
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - paperless-postgres:/var/lib/postgresql
    networks:
      - portabase-agent
      - paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  redis:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/library/redis:8
    container_name: paperless-redis
    hostname: paperless-redis
    environment:
      TZ: Europe/Paris
    volumes:
      - paperless-redis:/data
    networks:
      - paperless
    healthcheck:
      test: redis-cli ping || exit 1

  gotenberg:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/gotenberg/gotenberg:8.25
    container_name: gotenberg
    hostname: gotenberg
    environment:
      TZ: Europe/Paris
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  tika:
    restart: ${RESTART:-unless-stopped}
    image: docker.io/apache/tika:latest
    container_name: tika
    hostname: tika
    environment:
      TZ: Europe/Paris
    networks:
      - paperless

volumes:
  paperless-postgres:
    name: paperless-postgres
  paperless-redis:
    name: paperless-redis

networks:
  paperless:
    name: paperless
  portabase-agent:
    name: portabase-agent
    external: true
  webinternal:
    name: webinternal
