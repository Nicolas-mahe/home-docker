services:
  skyblog1:
    restart: unless-stopped
    image: docker.io/nginx:${NGINX_TAG:-alpine}
    container_name: web-skyblog1
    hostname: web-skyblog1
    labels:
      traefik.enable: true
      traefik.http.routers.skyblog1.tls: true
      traefik.http.routers.skyblog1.tls.certresolver: cloudflare
      traefik.http.routers.skyblog1.middlewares: authelia@docker,sablier-skyblog@docker,web-utils@docker
      traefik.http.routers.skyblog1.entrypoints: websecure
      traefik.http.routers.skyblog1.rule: Host(`${SKYBLOG1}.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.skyblog1.service: skyblog1
      traefik.http.services.skyblog1.loadBalancer.server.port: 80
      #sablier
      sablier.enable: true
      sablier.group: skyblog
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-skyblog.plugin.sablier.group: skyblog
      traefik.http.middlewares.sablier-skyblog.plugin.sablier.dynamic.displayName: Skyblogs
    environment:
      TZ: Europe/Paris
      NGINX_HOST: ${SKYBLOG1}.${PERSONAL_DOMAIN_NAME}
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/websites/${SKYBLOG1}.skyrock.com:/usr/share/nginx/html:ro
    expose:
      - 80
    networks:
      - webinternal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  skyblog2:
    restart: unless-stopped
    image: docker.io/nginx:${NGINX_TAG:-alpine}
    container_name: web-skyblog2
    hostname: web-skyblog2
    labels:
      traefik.enable: true
      traefik.http.routers.skyblog2.tls: true
      traefik.http.routers.skyblog2.tls.certresolver: cloudflare
      traefik.http.routers.skyblog2.middlewares: authelia@docker,sablier-skyblog@docker,web-utils@docker
      traefik.http.routers.skyblog2.entrypoints: websecure
      traefik.http.routers.skyblog2.rule: Host(`${SKYBLOG2}.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.skyblog2.service: skyblog2
      traefik.http.services.skyblog2.loadBalancer.server.port: 80
      #sablier
      sablier.enable: true
      sablier.group: skyblog
      traefik.docker.allownonrunning: true
    environment:
      TZ: Europe/Paris
      NGINX_HOST: ${SKYBLOG2}.${PERSONAL_DOMAIN_NAME}
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/websites/${SKYBLOG2}.skyrock.com:/usr/share/nginx/html:ro
    expose:
      - 80
    networks:
      - webinternal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  python-pronostics:
    restart: unless-stopped
    image: python:${PYTHON_TAG:-3.12-alpine3.21}
    container_name: python-pronostics
    hostname: python-pronostics
    labels:
      traefik.enable: true
      traefik.http.routers.python-pronostics.tls: true
      traefik.http.routers.python-pronostics.tls.certresolver: cloudflare
      traefik.http.routers.python-pronostics.entrypoints: websecure
      traefik.http.routers.python-pronostics.rule: Host(`pronostic.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.python-pronostics.middlewares: authelia@docker,sablier-pronostics@docker,web-utils@docker
      traefik.http.routers.python-pronostics.service: python-pronostics
      traefik.http.services.python-pronostics.loadBalancer.server.port: 5000
      #sablier
      sablier.enable: true
      sablier.group: pronostics
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-pronostics.plugin.sablier.group: pronostics
      traefik.http.middlewares.sablier-pronostics.plugin.sablier.dynamic.displayName: Pronostics
    environment:
      TZ: Europe/Paris
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/websites/pronostics:/data
    env_file:
      - stack.env
    command:
      - sh
      - -c
      - > 
        apk add --no-cache sqlite && cd /data &&
        pip install -r /data/requirements.txt && python3 /data/app.py
    networks:
    - webinternal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  python-baby-follow:
    restart: unless-stopped
    image: ghcr.io/nicolas-mahe/baby-follow:${DOCKER_TAG_BABY:-main}
    container_name: python-babyfollow
    hostname: python-babyfollow
    labels:
      traefik.enable: true
      traefik.http.routers.pythonbaby.tls: true
      traefik.http.routers.pythonbaby.tls.certresolver: cloudflare
      traefik.http.routers.pythonbaby.entrypoints: websecure
      traefik.http.routers.pythonbaby.middlewares: authelia@docker,sablier-baby@docker,web-utils@docker
      traefik.http.routers.pythonbaby.rule: Host(`baby.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.pythonbaby.service: pythonbaby
      traefik.http.services.pythonbaby.loadBalancer.server.port: 5000
      #sablier
      sablier.enable: true
      sablier.group: babyfollow
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-baby.plugin.sablier.group: babyfollow
      traefik.http.middlewares.sablier-baby.plugin.sablier.dynamic.displayName: Baby Follow
    environment:
      TZ: Europe/Paris
      SESSION_TOKEN: ${SESSION_TOKEN_BABY}
      DEBUG_MODE: ${DEBUG_MODE}
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/websites/baby-follow:/app/instance
    networks:
    - webinternal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  brainstorm:
    restart: unless-stopped
    image: ${DOCKER_REGISTRY_ADDR}/${PROJECT_PATH}:${DOCKER_TAG:-main}
    container_name: brainstorm
    hostname: brainstorm
    labels:
      traefik.enable: true
      traefik.http.routers.brainstorm.tls: true
      traefik.http.routers.brainstorm.tls.certresolver: cloudflare
      traefik.http.routers.brainstorm.middlewares: authelia@docker,sablier-brainstorm@docker,web-utils@docker
      traefik.http.routers.brainstorm.entrypoints: websecure
      traefik.http.routers.brainstorm.rule: Host(`brainstorm.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.brainstorm.service: brainstorm
      traefik.http.services.brainstorm.loadBalancer.server.port: 5000
      #sablier
      sablier.enable: true
      sablier.group: brainstorm
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-brainstorm.plugin.sablier.group: brainstorm
      traefik.http.middlewares.sablier-brainstorm.plugin.sablier.dynamic.displayName: Brainstorm
    environment:
      TZ: Europe/Paris
      SECRET_KEY: ${SECRET_KEY_BRAINSTORM}
      DEBUG_MODE: ${DEBUG_MODE}
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?required}/docker/docker-data/websites/brainstorm:/app/instance
    expose:
      - 5000
    networks:
      - webinternal

networks:
  webinternal:
    name: webinternal
