services:
  python-fleur:
    restart: unless-stopped
    image: python:3.12-alpine3.21
    container_name: python-fleur
    hostname: python-fleur
    labels:
      traefik.enable: true
      traefik.http.routers.python-fleur.tls: true
      traefik.http.routers.python-fleur.tls.certresolver: cloudflare
      traefik.http.routers.python-fleur.middlewares: sablier-python-fleur@docker,web-utils@docker
      traefik.http.routers.python-fleur.entrypoints: websecure
      traefik.http.routers.python-fleur.rule: Host(`fleur.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.python-fleur.service: python-fleur
      traefik.http.services.python-fleur.loadBalancer.server.port: 5000
      #sablier
      sablier.enable: true
      sablier.group: python-fleur
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-python-fleur.plugin.sablier.group: python-fleur
      traefik.http.middlewares.sablier-python-fleur.plugin.sablier.sessionDuration: 6h
      traefik.http.middlewares.sablier-python-fleur.plugin.sablier.dynamic.displayName: Fleur
    environment: 
      TZ: Europe/Paris
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/websites/fleurs:/data
    env_file:
      - .env
    command:
    - sh
    - -c
    - > 
      apk add --no-cache sqlite && cd /data &&
      pip install -r requirements.txt && python3 /data/app.py
    networks:
    - webinternal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  portabase-agent:
    restart: ${RESTART:-unless-stopped}
    image: portabase/agent:latest
    container_name: portabase-agent-fleurs
    hostname: portabase-agent-fleurs
    labels:
      #sablier
      sablier.enable: true
      sablier.group: portabase
      sablier.running-hours: "04:50-05:30"
    environment:
      TZ: Europe/Paris
      APP_ENV: production
      LOG: info
      EDGE_KEY: ${PORTABASE_EDGE_KEY:?edge key is required}
      MAX_CONCURRENT_BACKUPS: 1
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/portabase/agents/python-fleur:/config
      # volumes to backup
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/websites/fleurs:/save/python-fleur
    networks:
      - portabase-agent # needed for the agent to reach the S3 app & portabase
    depends_on:
      python-fleur:
        condition: service_healthy

volumes:
  python-fleur:
    name: python-fleur

networks:
  portabase-agent:
    name: portabase-agent
    external: true
  webinternal:
    name: webinternal