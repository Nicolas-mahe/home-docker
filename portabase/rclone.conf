# Storage configuration for rclone into Minio S3 compatible storage
# https://rclone.org/s3/#minio
# change remote path in portabase storage register to update bucket name

[Minio]
type = s3
provider = Minio
access_key_id = XXXXXX
secret_access_key = XXXXXXXXXXXX
region = eu-east-0
endpoint = https://s3.${PERSONAL_DOMAIN_NAME}
location_constraint =
server_side_encryption =
upload_concurrency = 1
no_check_bucket = true # bucket already existe
no_head = true # remove head check
tpslimit = 20 # limit the action number per sec