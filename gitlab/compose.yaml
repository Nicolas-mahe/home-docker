services:
  gitlab:
    restart: ${RESTART:-unless-stopped}
    image: gitlab/gitlab-ee:${GITLAB_TAG:-19.2.1-ee.0}
    container_name: gitlab
    hostname: gitlab
    shm_size: '256m'
    labels:
      traefik.enable: true
      traefik.docker.network: webinternal
      traefik.http.services.gitlab-web.loadBalancer.server.port: 80
      traefik.http.routers.gitlab-web.service: gitlab-web
      traefik.http.routers.gitlab-web.rule: Host(`gitlab.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.gitlab-web.middlewares: sablier-gitlab@docker
      traefik.http.routers.gitlab-web.entrypoints: websecure
      traefik.http.routers.gitlab-web.tls: true
      traefik.http.routers.gitlab-web.tls.certresolver: cloudflare
      traefik.http.services.gitlab-registry.loadBalancer.server.port: 5050
      traefik.http.routers.gitlab-registry.service: gitlab-registry
      traefik.http.routers.gitlab-registry.rule: Host(`registry.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.gitlab-registry.middlewares: sablier-gitlab@docker
      traefik.http.routers.gitlab-registry.entrypoints: websecure
      traefik.http.routers.gitlab-registry.tls: true
      traefik.http.routers.gitlab-registry.tls.certresolver: cloudflare
      traefik.tcp.routers.gitlab-ssh.rule: HostSNI(`*`)
      traefik.tcp.routers.gitlab-ssh.entrypoints: gitlab-ssh
      traefik.tcp.routers.gitlab-ssh.service: gitlab-ssh
      traefik.tcp.services.gitlab-ssh.loadbalancer.server.port: 22
      #sablier
      sablier.enable: true
      sablier.group: gitlab
      sablier.running-hours: "04:20-05:30"
      traefik.docker.allownonrunning: true
      traefik.http.middlewares.sablier-gitlab.plugin.sablier.group: gitlab
      traefik.http.middlewares.sablier-gitlab.plugin.sablier.sessionDuration: 2h
      traefik.http.middlewares.sablier-gitlab.plugin.sablier.dynamic.displayName: Gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.${PERSONAL_DOMAIN_NAME}'
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "mail.${MAIL_SERVER_DOMAIN_NAME}"
        gitlab_rails['smtp_port'] = 465
        gitlab_rails['smtp_user_name'] = "gitlab@${PERSONAL_DOMAIN_NAME}"
        gitlab_rails['smtp_password'] = "${MAIL_SERVER_PASSWORD}"
        gitlab_rails['smtp_domain'] = "${MAIL_SERVER_DOMAIN_NAME}"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['smtp_tls'] = true
        gitlab_rails['smtp_pool'] = true
        gitlab_rails['gitlab_email_from'] = 'gitlab@${PERSONAL_DOMAIN_NAME}'
        gitlab_rails['gitlab_email_reply_to'] = 'gitlab@${PERSONAL_DOMAIN_NAME}'
        gitlab_rails['gitlab_shell_ssh_port'] = 6322
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['redirect_http_to_https'] = true
        registry_external_url 'https://registry.${PERSONAL_DOMAIN_NAME}'
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
        gitlab_rails['registry_enabled'] = true
        postgresql['shared_buffers'] = "256MB"
        sidekiq['max_concurrency'] = 4
        sidekiq['concurrency'] = 1
        puma['worker_timeout'] = 120
        puma['worker_processes'] = 1
        letsencrypt['enable'] = false
        gitlab_rails['backup_archive_permissions'] = 0655
        gitlab_rails['backup_keep_time'] = 82800 # 23h
        prometheus_monitoring['enable'] = false
        gitlab_rails['gitlab_default_theme'] = 2
        gitlab_rails['gitlab_default_color_mode'] = 2
        gitlab_rails['initial_gitlab_product_usage_data'] = false
    volumes:
      - data:/var/opt/gitlab
      - logs:/var/log/gitlab
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/gitlab/config:/etc/gitlab
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/gitlab/backups:/var/opt/gitlab/backups
    networks:
      - gitlab
      - webinternal
    # In case of restoration of a backup, the healthcheck should be disabled to avoid the container being restarted while restoring.
    # healthcheck:
    #   disable: true

  gitlab-runner:
    restart: ${RESTART:-unless-stopped}
    image: gitlab/gitlab-runner:${RUNNER_TAG:-v19.2.0}
    container_name: gitlab-runner
    hostname: gitlab-runner
    labels:
      #sablier
      sablier.enable: true
      sablier.group: gitlab
      traefik.docker.allownonrunning: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/gitlab/runner-config:/etc/gitlab-runner
      - runner-home:/home/gitlab-runner
    networks:
      - gitlab
    depends_on:
      gitlab:
        condition: service_healthy

  portabase-agent:
    restart: ${RESTART:-unless-stopped}
    image: portabase/agent:latest
    container_name: portabase-agent-gitlab
    hostname: portabase-agent-gitlab
    labels:
      #sablier
      sablier.enable: true
      sablier.group: gitlab,portabase
      sablier.running-hours: "04:50-05:30"
    environment:
      TZ: Europe/Paris
      APP_ENV: production
      LOG: info
      EDGE_KEY: ${PORTABASE_EDGE_KEY:?edge key is required}
      MAX_CONCURRENT_BACKUPS: 1
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/portabase/agents/gitlab:/config
      # gitlab data volumes to backup
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/gitlab/backups:/var/opt/gitlab/backups
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/gitlab/config:/etc/gitlab
      # gitlab-runner data volumes to backup
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/gitlab/runner-config:/etc/gitlab-runner
    networks:
      - portabase-agent # needed for the agent to reach the S3 app & portabase
    depends_on:
      gitlab:
        condition: service_healthy

volumes:
  data:
  logs:
  runner-home:

networks:
  gitlab:
    name: gitlab
  portabase-agent:
    name: portabase-agent
  webinternal:
    name: webinternal