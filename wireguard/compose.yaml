services:
  wg-easy:
    restart: ${RESTART:-unless-stopped}
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    hostname: wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    labels:
      traefik.enable: true
      traefik.network: wireguard
      traefik.http.services.wireguard.loadbalancer.server.port: 51821
      traefik.http.routers.wireguard.service: wireguard
      traefik.http.routers.wireguard.rule: Host(`vpn.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.wireguard.entrypoints: websecure
      traefik.http.routers.wireguard.tls.certresolver: cloudflare
    environment:
      TZ: Europe/Paris
      PUID: ${PUID}
      PGID: ${PGID}
      WG_HOST: vpn.${PERSONAL_DOMAIN_NAME}
      WG_PORT: ${WG_PORT}
      WG_DEFAULT_DNS: ${PERSONAL_NETWORK}.2 #1.0.0.1
      # PASSWORD: 
      WG_DEFAULT_ADDRESS: 10.8.0.x
      # WG_MTU: 1420
      #-WG_ALLOWED_IPS: 
      # WG_PRE_UP: echo "Pre Up" > /etc/wireguard/pre-up.txt
      # WG_POST_UP: echo "Post Up" > /etc/wireguard/post-up.txt
      # WG_PRE_DOWN: echo "Pre Down" > /etc/wireguard/pre-down.txt
      # WG_POST_DOWN: echo "Post Down" > /etc/wireguard/post-down.txt
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/wireguard/wg-easy:/etc/wireguard
    ports:
      - ${WG_PORT}:51821/tcp
      - ${WG_PORT}:${WG_PORT}/udp
    networks:
      - wireguard
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 -W 3 10.8.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 30s

# Generate a conf from wg-easy and past it on conf's volume under wg_confs/wg0.conf
  wireguard:
    restart: ${RESTART:-unless-stopped}
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    hostname: wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: Europe/Paris
    volumes:
      - /${DOCKER_DATA_DIRECTORY:?data path is required}/docker/docker-data/wireguard/client:/config
      - /lib/modules:/lib/modules:ro
    networks:
      - wireguard
    depends_on:
      wg-easy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 -W 3 10.8.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  wireguard:
    name: wireguard
