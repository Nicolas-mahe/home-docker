services:
  adguardhome:
    restart: always
    image: docker.io/adguard/adguardhome:${ADGUARDHOME_TAG:-latest}
    container_name: adguardhome
    hostname: adguardhome
    labels:
      traefik.enable: true
      traefik.http.routers.adguard.tls: true
      traefik.http.routers.adguard.tls.certresolver: cloudflare
      traefik.http.routers.adguard.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.adguard.entrypoints: websecure
      traefik.http.routers.adguard.rule: Host(`dns.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.adguard.service: adguard
      traefik.http.services.adguard.loadBalancer.server.port: 81
    environment:
      PUID: ${PUID}
      GUID: ${PGID}
      ADGUARDHOME_INTERFACE: ${ADGUARDHOME_INTERFACE:-eth0}
      TZ: Europe/Paris
    volumes:
      - data:/opt/adguardhome/work
      - /${DOCKER_DATA_DIRECTORY}/docker/docker-data/adguard/conf:/opt/adguardhome/conf
    # ports:
    #   - 81:81
    healthcheck:
      test: nslookup www.google.com || exit 1
      timeout: 5s
      interval: 60s
      start_period: 10s
      retries: 2
volumes:
  data:
    name: adguardhome-data