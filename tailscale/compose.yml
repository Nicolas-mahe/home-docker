services:
  tailscale:
    restart: unless-stopped
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
    volumes:
      - tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    network_mode: host

volumes:
  tailscale:

version: '3.8'
services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:v1.96.5
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    devices:
      - /dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ACCEPT_DNS=false
      - TS_HOSTNAME=pdcpd1002nas
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
      - TS_AUTHKEY=tskey-auth-kifEZ9RYN911CNTRL-RSkNjdENC6XnmW4ja3fM6XRKVAvMUwqx
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_EXTRA_ARGS=--advertise-exit-node=false --reset=false --accept-routes=false
      - TZ=Europe/Paris
    healthcheck:
      test: ["CMD", "tailscale", "status"]
    network_mode: host
    tmpfs:
      - /var/run/tailscale:mode=0755
    volumes:
      - /mnt/.ix-apps/app_mounts/tailscale/state:/var/lib/tailscale